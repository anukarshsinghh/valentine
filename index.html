<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>For You ❤️</title>

<style>
body{
    text-align:center;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(120deg,#ffccd5,#ffe6f0);
    overflow:hidden;
    margin-top:120px;
}

h1{
    color:#ff1a75;
    font-size:40px;
}

button{
    padding:12px 28px;
    font-size:18px;
    margin:10px;
    border:none;
    border-radius:30px;
    cursor:pointer;
    transition:0.3s;
}

#yes{
    background:#ff4da6;
    color:white;
}

#no{
    background:#ddd;
}

button:hover{
    transform:scale(1.1);
}

/* floating hearts */
.heart{
    position:fixed;
    bottom:-20px;
    color:#ff4da6;
    animation: floatUp 6s linear infinite;
}

@keyframes floatUp{
    from{ transform:translateY(0); opacity:1; }
    to{ transform:translateY(-800px); opacity:0; }
}
</style>
</head>

<body>

<h1 id="question">Do you like me? ❤️</h1>

<button id="yes" onclick="nextStep()">Yes</button>
<button id="no" onmouseover="moveNo()">No</button>

<script>
let step = 1;

function moveNo(){
    const btn = document.getElementById("no");
    btn.style.position="absolute";
    btn.style.top = Math.random()*500 + "px";
    btn.style.left = Math.random()*800 + "px";
}

function nextStep(){
    if(step === 1){
        document.getElementById("question").innerHTML =
        "Will you accept my rose? 💌";
        step = 2;
    }
    else if(step === 2){
        document.body.innerHTML =
        "<h1>I really like you ❤️</h1><p style='font-size:22px'>Happy Rose Day Bettu</p>";
        hearts();
    }
}

/* create floating hearts */
function hearts(){
    setInterval(()=>{
        let heart = document.createElement("div");
        heart.className="heart";
        heart.style.left = Math.random()*100 + "vw";
        heart.innerHTML="❤";
        heart.style.fontSize = (Math.random()*20+20)+"px";
        document.body.appendChild(heart);
        setTimeout(()=>heart.remove(),6000);
    },300);
}
</script>

</body>
</html>
