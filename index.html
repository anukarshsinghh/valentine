<title>For You ❤️</title>

<style>
body{

    margin-top:120px;
    transition:1s;
}

h1{
    color:#ff1a75;
    font-size:40px;
}

button{
    padding:12px 28px;
    font-size:18px;
    margin:10px;
    border:none;
    border-radius:30px;
    cursor:pointer;
    transition:0.3s;
}

#yes{ background:#ff4da6; color:white; }
#no{ background:#ddd; }

button:hover{ transform:scale(1.1); }

.heart{
    position:fixed;
    bottom:-20px;
    color:#ff4da6;
    animation: floatUp 6s linear infinite;
}

@keyframes floatUp{
    from{ transform:translateY(0); opacity:1; }
    to{ transform:translateY(-800px); opacity:0; }
}
</style>
</head>
